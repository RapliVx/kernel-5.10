name: "Kernel Build"

env:
  OUT_DIR: "out"

on:
  workflow_dispatch:
    inputs:
      buildKSU:
        description: "Select Variants"
        required: true
        type: choice
        default: "all"
        options:
          - "vanilla"
          - "ksu"
          - "all"
      ltoType:
        description: "Link Time Optimization (LTO)"
        required: true
        type: choice
        default: "thin"
        options:
          - "thin"
          - "full"

jobs:
  build-kernel:
    name: "Build: ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(
          github.event.inputs.buildKSU == 'all' && '["vanilla", "ksu"]' ||
          github.event.inputs.buildKSU == 'vanilla' && '["vanilla"]' ||
          github.event.inputs.buildKSU == 'ksu' && '["ksu"]' ||
          '["vanilla", "ksu"]' ) }}

    steps:
      - name: "Checkout Kernel Source"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Setup Build Environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 build-essential bc curl flex cpio git zip dwarves libelf-dev gcc-aarch64-linux-gnu libssl-dev python3 python3-lxml python3-rich clang lld llvm llvm-dev
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: "Download Clang r547379"
        run: |
          aria2c -x 16 -s 16 -o clang.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p clang
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: "Setup KernelSU"
        if: matrix.variant == 'ksu'
        run: |
          curl -LSs "https://raw.githubusercontent.com/RapliVx/KernelSU/xxksu/kernel/setup.sh" | bash -s xxksu

      - name: "Configure Kernel"
        run: |
          BUILD_ARGS=(
            O=out
            ARCH=arm64
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            READELF=llvm-readelf
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            LLVM=1
            LLVM_IAS=1
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__"
          )

          echo "Configuring gki_defconfig..."
          make -j$(nproc --all) "${BUILD_ARGS[@]}" gki_defconfig

          if [ "${{ github.event.inputs.ltoType }}" = "thin" ] || [ -z "${{ github.event.inputs.ltoType }}" ]; then
            echo "Enabling ThinLTO..."
            ./scripts/config --file out/.config -d LTO_CLANG_FULL -e LTO_CLANG_THIN
          else
            echo "Enabling Full LTO..."
            ./scripts/config --file out/.config -d LTO_CLANG_THIN -e LTO_CLANG_FULL
          fi
          make -j$(nproc --all) "${BUILD_ARGS[@]}" olddefconfig

      - name: "Configure KernelSU"
        if: matrix.variant == 'ksu'
        run: |
          echo "Applying KernelSU configuration to out/.config..."
          cat << 'EOF' >> out/.config
          # KernelSU Configuration
          CONFIG_KSU=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_FEATURE_SULOG=y
          CONFIG_KSU_FEATURE_ADBROOT=y
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          # CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set
          # CONFIG_KSU_KPROBES_KSUD is not set
          CONFIG_KSU_HOSTSREDIRECT=y
          CONFIG_KSU_ENABLE_FULL_UID_CHECKS=y
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          # CONFIG_KSU_NOPRINTK=y
          # CONFIG_KSU_SHELL_HAS_SU_ALWAYS is not set
          # CONFIG_KSU_DEBUG is not set
          EOF
          ./scripts/config --file out/.config \
            -e KSU \
            -e KSU_LSM_SECURITY_HOOKS \
            -e KSU_FEATURE_SULOG \
            -e KSU_FEATURE_ADBROOT \
            -e KSU_HACK_ARM64_BRANCH_LINK \
            -d KSU_TAMPER_SYSCALL_TABLE \
            -d KSU_KPROBES_KSUD \
            -e KSU_HOSTSREDIRECT \
            -e KSU_ENABLE_FULL_UID_CHECKS \
            -e KSU_THRONE_TRACKER_ALWAYS_THREADED \
            -e KSU_NOPRINTK \
            -d KSU_SHELL_HAS_SU_ALWAYS \
            -d KSU_DEBUG

          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS="-D__ANDROID_COMMON_KERNEL__" olddefconfig

      - name: "Build Kernel"
        run: |
          BUILD_ARGS=(
            O=out
            ARCH=arm64
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            READELF=llvm-readelf
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            LLVM=1
            LLVM_IAS=1
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__"
          )

          echo "Compiling Image & modules..."
          make -j$(nproc --all) "${BUILD_ARGS[@]}" Image modules

      - name: "Verify KMI Symbols"
        run: |
          python3 KMI_function_symbols_test.py

      - name: "Package AnyKernel3"
        run: |
          git clone --depth=1 --branch GKI-5.10 https://github.com/RapliVx/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          rm -rf .git .github README.md *placeholder
          DATE=$(date +'%Y%m%d_%H%M')
          ZIP_NAME="AnyKernel3-android12-5.10-${DATE}-${{ matrix.variant }}.zip"
          zip -r9 "../$ZIP_NAME" ./*
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "Prepare Release Assets"
        id: prepare_release
        run: |
          mkdir -p release_assets
          cp out/arch/arm64/boot/Image "release_assets/Image-${{ matrix.variant }}"
          [ -f out/vmlinux.symvers ] && cp out/vmlinux.symvers "release_assets/vmlinux-${{ matrix.variant }}.symvers"
          [ -f "${ZIP_NAME}" ] && cp "${ZIP_NAME}" release_assets/

          cd release_assets
          sha256sum * > "sha256sum-${{ matrix.variant }}.txt"
          cd ..

          KERNEL_VER=$(make kernelversion)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_NAME="${KERNEL_VER}-${BUILD_TIME}-${SHORT_SHA}"

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_release.outputs.TAG_NAME }}
          name: "Kernel ${{ steps.prepare_release.outputs.KERNEL_VER }} (${{ env.BUILD_TIME }})"
          body: |
            ### 🚀 Kernel Release Info
            - **Kernel Version:** `${{ steps.prepare_release.outputs.KERNEL_VER }}`
            - **Commit:** `${{ steps.prepare_release.outputs.SHORT_SHA }}`
            - **Build Date:** `${{ env.BUILD_TIME }}`
            - **Compiler:** Clang r547379 (LLVM)
            - **Variant:** `${{ matrix.variant }}`
            - **LTO:** `${{ github.event.inputs.ltoType || 'thin' }}`

            ### 📦 Included Files
            - `AnyKernel3-*.zip`: Flashable ZIP via Recovery (TWRP/OrangeFox) or KernelSU/APatch
            - `Image-${{ matrix.variant }}`: Uncompressed kernel binary
            - `vmlinux-${{ matrix.variant }}.symvers`: Kernel symbol versions
            - `sha256sum-${{ matrix.variant }}.txt`: Checksums for file verification
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
